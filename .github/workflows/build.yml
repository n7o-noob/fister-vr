# Rebuilds docs/ and dist/ whenever src/ or site/ changes, and commits the result.
# GitHub Pages (Settings > Pages > Deploy from a branch > main /docs) then publishes the new setup page.
name: Build

on:
  push:
    branches: [main]
    paths: ['src/**', 'site/**', 'tools/**', 'qol/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.cjs
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dist
          git diff --cached --quiet || git commit -m "Build docs and dist"
          git push
