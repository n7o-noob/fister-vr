<!doctype html><html><head><meta charset="utf-8"><title>mock fister 2</title>
<style>body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
#hud{position:fixed;inset:0;pointer-events:none}
#hp{position:absolute;left:20px;bottom:20px;width:220px;height:22px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:6px}
#hp i{display:block;height:100%;width:70%;background:#3c3}
#label{position:absolute;left:20px;bottom:50px;color:#fff;font-weight:bold;text-shadow:0 0 3px #000;text-transform:uppercase}
#respawn{position:absolute;left:50%;top:40%;transform:translateX(-50%);pointer-events:auto;padding:14px 30px;font-size:22px;background:#c33;color:#fff;border:0;border-radius:8px;cursor:pointer}
</style></head>
<body><div id="game"></div>
<div id="hud"><div id="label">Health 70</div><div id="hp"><i></i></div><button id="respawn">Respawn</button></div>
<script type="module" src="./game2.js"></script></body></html>
